<mat-sidenav-container class="ren-shell">
    <mat-sidenav
        #drawer
        class="ren-sidebar"
        [mode]="(isHandset$ | async) ? 'over' : 'side'"
        [opened]="!(isHandset$ | async)">
        <div class="ren-sidebar-brand">
            <div class="flex items-center gap-3">
                <div class="ren-sidebar-brand-icon">
                    <mat-icon [svgIcon]="'heroicons_solid:heart'"></mat-icon>
                </div>
                <div>
                    <div class="ren-sidebar-brand-title">Renaissance</div>
                    <div class="ren-sidebar-brand-subtitle">Clinical EMR</div>
                </div>
            </div>
        </div>

        <mat-nav-list class="ren-sidebar-nav">
            @for (item of navItems; track item.link) {
                <a
                    mat-list-item
                    [routerLink]="item.link"
                    routerLinkActive="nav-active"
                    [routerLinkActiveOptions]="{ exact: item.link === '/' }"
                    (click)="closeDrawerOnMobile(drawer)">
                    <mat-icon matListItemIcon [svgIcon]="item.icon"></mat-icon>
                    <span matListItemTitle>{{ item.title }}</span>
                </a>
            }
        </mat-nav-list>

        <div class="ren-sidebar-user">
            <div class="flex items-center gap-2">
                <mat-icon [svgIcon]="'heroicons_solid:user-circle'"></mat-icon>
                <div>
                    <div class="ren-sidebar-user-name">Clinical User</div>
                    <div class="ren-sidebar-user-role">Outpatient care</div>
                </div>
            </div>
        </div>
    </mat-sidenav>

    <mat-sidenav-content class="ren-content">
        <mat-toolbar class="ren-toolbar">
            @if (isHandset$ | async) {
                <button mat-icon-button type="button" class="ren-menu-btn" aria-label="Open menu" (click)="drawer.toggle()">
                    <mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
                </button>
            }
            <mat-icon class="ren-toolbar-icon mr-2 hidden sm:inline-flex" [svgIcon]="'heroicons_outline:building-office-2'"></mat-icon>
            <div class="ren-toolbar-text">
                <span class="ren-toolbar-title">Renaissance Clinical</span>
                <span class="ren-toolbar-subtitle hidden md:inline">Integrated Patient Care</span>
            </div>
            <span class="flex-auto"></span>
            <a mat-stroked-button class="ren-toolbar-cta hidden sm:inline-flex" routerLink="/clients/new">
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                <span class="ml-1">New Client</span>
            </a>
        </mat-toolbar>

        <main class="ren-main">
            <router-outlet></router-outlet>
        </main>

        <footer class="ren-footer">
            <div class="ren-footer-inner">
                <span class="ren-footer-copy">
                    <mat-icon class="ren-footer-icon" [svgIcon]="'heroicons_outline:shield-check'"></mat-icon>
                    &copy; {{ currentYear }} Renaissance Clinical Data Collection
                </span>
                <span class="ren-footer-tagline">
                    <mat-icon class="ren-footer-icon" [svgIcon]="'heroicons_outline:building-office-2'"></mat-icon>
                    Outpatient Care Platform
                </span>
            </div>
        </footer>
    </mat-sidenav-content>
</mat-sidenav-container>
