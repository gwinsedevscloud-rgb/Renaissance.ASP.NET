<div class="flex flex-col flex-auto p-6 md:p-8">
    <ng-container>
        <div class="relative w-full  sm:px-12 bg-accent-100 dark:bg-transparent">
            <!-- Close button -->
            <div class="flex items-center justify-end w-full max-w-3xl mx-auto">
                <a
                    mat-icon-button
                    [matTooltip]="'Close'"
                    (click)="closeDrawer()">
                    <mat-icon
                        class="text-gray"
                        [svgIcon]="'heroicons_outline:x-circle'"></mat-icon>
                </a>
            </div>
        </div>

        <div class="relative flex flex-col flex-auto items-center px-6">
            <div class="w-full max-w-10xl">
                <div class="mt-6">
                    <h2 class="text-xl font-semibold">Ancillary Service</h2>

                    <div class="w-full mt-3">
                        <mat-form-field class="w-full " [subscriptSizing]="'dynamic'">
                            <mat-label>Pregnancy Status</mat-label>
                            <mat-icon matPrefix class="hidden sm:flex icon-size-5" [svgIcon]="'heroicons_outline:calendar'"></mat-icon>
                            <mat-select [ngModel]="pregnancyStatus()">
                                <mat-option value="Pregnant">Pregnant</mat-option>
                                <mat-option value="Not Pregnant">Not Pregnant</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>

                    <div class="space-y-6">
                        <mat-expansion-panel>
                            <mat-expansion-panel-header>
                                <mat-panel-title class="font-semibold text-lg text-gray-800">Services</mat-panel-title>
                            </mat-expansion-panel-header>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-4 gap-y-1 py-4">
                                <mat-checkbox (change)="addDispensedItem('DEWORMING', $event.checked)">DEWORMING</mat-checkbox>
                                <mat-checkbox (change)="addDispensedItem('ITN', $event.checked)">ITN</mat-checkbox>
                                <mat-checkbox (change)="addDispensedItem('DENTAL MATERIAL - Tooth Paste', $event.checked)">DENTAL MATERIAL - Tooth Paste</mat-checkbox>
                                <mat-checkbox (change)="addDispensedItem('DENTAL MATERIAL - Tooth Brush', $event.checked)">DENTAL MATERIAL - Tooth Brush</mat-checkbox>
                            </div>
                        </mat-expansion-panel>

                    </div>

                    <!-- Submit -->
                    <div class="pt-6">
                        <button mat-flat-button color="primary" type="button" (click)="submit()">Save</button>
                    </div>

                </div>
            </div>
        </div>
    </ng-container>
</div>
