<div class="flex flex-col flex-auto p-6 md:p-8">
    <ng-container>

        <!-- Header -->
        <div class="relative w-full  sm:px-12 bg-accent-100 dark:bg-transparent">
            <!-- Close button -->
            <div class="flex items-center justify-end w-full max-w-3xl mx-auto">
                <a
                    mat-icon-button
                    [matTooltip]="'Close'"
                    (click)="closeDrawer()">
                    <mat-icon
                        class="text-gray"
                        [svgIcon]="'heroicons_outline:x-circle'"></mat-icon>
                </a>
            </div>
        </div>

        <div class="relative flex flex-col flex-auto items-center px-6">
            <div class="w-full max-w-6xl">
                <form [formGroup]="triageForm">
                    <!-- Section: Anthropometry -->
                    <h3 class="text-lg font-semibold mt-6">Anthropometry</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <mat-form-field  class="w-full">
                            <mat-label>Weight (kg)</mat-label>
                            <input matInput type="number" formControlName="weight" />
                        </mat-form-field>

                        <mat-form-field class="w-full">
                            <mat-label>Height (cm)</mat-label>
                            <input matInput type="number" formControlName="height" />
                        </mat-form-field>
                    </div>

                    <!-- Section: Vital Signs -->
                    <h3 class="text-lg font-semibold mt-6">Vital Signs</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <mat-form-field class="w-full">
                            <mat-label>Systolic BP (mmHg)</mat-label>
                            <input matInput type="number" formControlName="systolicBp" />
                        </mat-form-field>

                        <mat-form-field class="w-full">
                            <mat-label>Diastolic BP (mmHg)</mat-label>
                            <input matInput type="number" formControlName="diastolicBp" />
                        </mat-form-field>

                        <mat-form-field class="w-full">
                            <mat-label>Temperature (°C)</mat-label>
                            <input matInput type="number" step="0.1" formControlName="temperature" />
                        </mat-form-field>

                        <mat-form-field class="w-full">
                            <mat-label>Pulse Rate (bpm)</mat-label>
                            <input matInput type="number" formControlName="pulseRate" />
                        </mat-form-field>

                        <mat-form-field class="w-full">
                            <mat-label>Respiratory Rate (cycles/min)</mat-label>
                            <input matInput type="number" formControlName="respiratoryRate" />
                        </mat-form-field>
                    </div>

                    <div class="w-full md:w-1/3">
                        <div class="p-2 border rounded-md bg-gray-50 h-full flex items-center justify-between">
                            <span class="font-medium text-gray-700">BMI:</span>
                            <span class="font-semibold text-blue-700">{{ bmi || '—' }}</span>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="pt-4">
                        <button [disabled]="triageForm.invalid" (click)="saveTriage()" mat-flat-button color="primary" type="button">
                            @if (!editMode()) {
                                Save
                            } @else {
                                Update
                            }
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </ng-container>
</div>
