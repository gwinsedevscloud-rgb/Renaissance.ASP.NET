<ng-container>
    <h2 class="text-xl font-semibold mb-4">Update Result for {{ data.testName }}</h2>

    <form [formGroup]="resultForm">
        <mat-form-field appearance="fill" class="w-full mb-4">
            <mat-label>Result</mat-label>
            <ng-container [ngSwitch]="data.testName">
                <ng-container *ngSwitchCase="'Random Blood Sugar'">
                    <mat-form-field class="w-full">
                        <input
                            matInput
                            type="text"
                            formControlName="result"
                            placeholder="e.g. 95 mg/dL" />
                    </mat-form-field>
                </ng-container>

                <ng-container *ngSwitchCase="'Cholesterol'">
                    <mat-form-field class="w-full">
                        <input
                            matInput
                            type="text"
                            formControlName="result"
                            placeholder="e.g. 180 mg/dL" />
                    </mat-form-field>
                </ng-container>

                <ng-container *ngSwitchDefault>
                    <mat-form-field class="w-full">
                        <mat-select formControlName="result">
                            <mat-option value="positive">Positive</mat-option>
                            <mat-option value="negative">Negative</mat-option>
                        </mat-select>
                    </mat-form-field>
                </ng-container>


            </ng-container>
        </mat-form-field>

        <mat-form-field appearance="fill" class="w-full mb-4">
            <mat-label>Note</mat-label>
            <textarea matInput formControlName="note" rows="3"></textarea>
        </mat-form-field>

        <div class="flex justify-end">
            <button mat-flat-button color="primary" [disabled]="isSaving()" (click)="onSubmit()">
                @if (data.result){
                    Update
                } @else {
                    Save
                }
            </button>
        </div>
    </form>

</ng-container>
